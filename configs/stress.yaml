project:
  random_state: 42
  artifact_dir: "artifacts"
  data_dir: "data"

synthetic:
  rows: 100000
  default_rate_target: 0.35
  noise_level: 0.05
  missing_rate: 0.02
  outlier_rate: 0.01

data:
  default_rows: 100000
  test_size: 0.2
  validation_size: 0.0
  target_column: "target"
  id_column: "applicant_id"

features:
  numeric:
    - age
    - income
    - employment_years
    - loan_amount
    - loan_term_months
    - interest_rate
    - debt_to_income
    - credit_history_years
    - previous_defaults
    - open_credit_lines
    - late_payments_12m
    - savings_balance
    - checking_balance
  categorical:
    - home_ownership
    - education
    - purpose
    - region
    - application_channel
  target: "target"
  id_column: "applicant_id"

preprocessing:
  numeric_strategy: "median"
  categorical_strategy: "most_frequent"
  scaling: true

training:
  primary_metric: "pr_auc"
  cv_folds: 3
  n_jobs: 1
  enable_hyperparameter_search: false
  max_search_iter: 5
  random_state: 42
  models:
    - logistic_regression
    - random_forest
  scoring_metric: "pr_auc"
  test_size: 0.2

models:
  logistic_regression:
    class_weight: "balanced"
    max_iter: 2000
  random_forest:
    class_weight: "balanced"
    n_estimators: 100
  gradient_boosting:
    n_estimators: 100
  hist_gradient_boosting:
    max_iter: 100

threshold:
  fn_cost: 5
  fp_cost: 1
  min_recall: 0.75
  min_precision: 0.60
  manual_review_low: 0.3
  manual_review_high: 0.7

validation:
  max_missing_share: 0.5
  max_duplicate_share: 0.1
  leakage_keywords:
    - target
    - default
    - approved
    - decision
    - status
    - paid
    - delinquent
    - outcome

reports:
  generate_plots: true
  generate_html: true
  generate_markdown: true
  format: "html"
  title: "Credit Risk Research Lab Report (Stress Test)"

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_samples: "data/samples"
  artifacts_models: "artifacts/models"
  artifacts_reports: "artifacts/reports"
  artifacts_plots: "artifacts/plots"
  artifacts_metrics: "artifacts/metrics"
  artifacts_predictions: "artifacts/predictions"
  artifacts_audit: "artifacts/audit"
  artifacts_logs: "artifacts/logs"
