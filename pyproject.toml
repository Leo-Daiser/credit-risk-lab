[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-lab"
version = "0.1.0"
description = "Credit Risk Research Lab - ML pipeline for credit scoring"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pydantic>=2.0",
    "typer>=0.9",
    "matplotlib>=3.7",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
boost = ["xgboost>=2.0", "lightgbm>=4.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1.0"]

[project.scripts]
credit-risk = "app.cli:app"

[tool.pytest.ini_options]
testpaths = [
    "tests/unit",
    "tests/integration",
    "tests/smoke",
    "tests/regression",
]
pythonpath = ["."]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "smoke: Smoke tests",
    "regression: Regression tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
